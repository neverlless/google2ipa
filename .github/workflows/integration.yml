name: Integration
on:
  schedule: [{cron: "0 5 * * 1"}]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeipa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: stable}
      - name: Start FreeIPA
        run: ./hack/freeipa-up.sh | tail -1 | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"
      - run: go test -tags integration -run Integration -v ./internal/ipa/
      - if: failure()
        run: docker logs g2i-ipa | tail -200
