version: 2
project_name: google2ipa
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/google2ipa
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, config.example.yaml]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "^ci:"]
